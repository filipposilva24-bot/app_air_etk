<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Peças ETK</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f9; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        textarea { width: 100%; height: 100px; margin-bottom: 10px; padding: 10px; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; margin-bottom: 20px; }
        button:hover { background-color: #0056b3; }
        .item-row { display: flex; align-items: center; justify-content: space-between; padding: 10px; border-bottom: 1px solid #eee; }
        .item-row button { margin: 0; background-color: #28a745; width: 60%; text-align: left; overflow: hidden; text-overflow: ellipsis; }
        .item-row button:hover { background-color: #218838; }
        .item-row input { width: 30%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .item-row span { font-weight: bold; width: 5%; text-align: center; }
        #finalResult { margin-top: 20px; background: #e9ecef; padding: 15px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Extrator de Códigos ETK</h2>
    <p>Cole a lista da IA no formato: <strong>Quantidade | Nome da Peça</strong></p>
    <textarea id="aiInput" placeholder="Ex: 6 | Parafuso M10 do conversor de binário ao volante do motor"></textarea>
    <button onclick="processarLista()">Processar Lista</button>

    <div id="listaPecas"></div>

    <button onclick="gerarListaFinal()" style="background-color: #17a2b8; width: 100%;">Gerar Lista Final (Códigos + Quantidades)</button>
    <div id="finalResult">
        <strong>Resultado Final:</strong>
        <pre id="outputText"></pre>
    </div>
</div>

<script>
    function processarLista() {
        const input = document.getElementById('aiInput').value;
        const linhas = input.split('\n').filter(linha => linha.trim() !== '');
        const listaDiv = document.getElementById('listaPecas');
        listaDiv.innerHTML = '';

        linhas.forEach((linha, index) => {
            const partes = linha.split('|');
            if (partes.length >= 2) {
                const qtd = partes[0].trim();
                const peca = partes[1].trim();

                const div = document.createElement('div');
                div.className = 'item-row';
                
                div.innerHTML = `
                    <span>${qtd}x</span>
                    <button onclick="copiarTexto('${peca}')" title="Clique para copiar">📋 ${peca}</button>
                    <input type="text" placeholder="Código ETK" id="etk-${index}" data-qtd="${qtd}">
                `;
                listaDiv.appendChild(div);
            }
        });
    }

    function copiarTexto(texto) {
        navigator.clipboard.writeText(texto).then(() => {
            alert('Peça copiada: ' + texto);
        });
    }

    function gerarListaFinal() {
        const inputs = document.querySelectorAll('input[id^="etk-"]');
        let resultado = "";
        
        inputs.forEach(input => {
            const codigo = input.value.trim();
            const qtd = input.getAttribute('data-qtd');
            if (codigo !== "") {
                resultado += `${codigo}\t${qtd}\n`; // Tabulação entre código e quantidade
            }
        });

        document.getElementById('outputText').textContent = resultado;
        document.getElementById('finalResult').style.display = 'block';
        navigator.clipboard.writeText(resultado);
        alert('Lista final copiada para a área de transferência!');
    }
</script>

</body>
</html>
