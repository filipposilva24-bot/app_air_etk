<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitor de Manuais AIR - Oficina AI</title>
    <!-- Importando o leitor de PDF direto no navegador -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <style>
        :root {
            --primary: #0066b2; /* Azul estilo BMW */
            --bg: #f4f7f6;
            --text: #333;
            --card-bg: #fff;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        h2 {
            text-align: center;
            color: var(--primary);
        }

        /* Área de Upload */
        .upload-area {
            border: 2px dashed #ccc;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            background-color: var(--card-bg);
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .upload-area:hover, .upload-area.dragover {
            border-color: var(--primary);
            background-color: #e9f2fa;
        }

        .upload-area input[type="file"] {
            display: none;
        }

        /* Loader */
        #loader {
            display: none;
            text-align: center;
            margin: 20px 0;
            font-weight: bold;
            color: var(--primary);
        }

        /* Resultados */
        #results {
            display: none;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .grupo-titulo {
            background-color: #333;
            color: white;
            padding: 10px;
            border-radius: 5px;
            margin-top: 20px;
            font-size: 1.1em;
        }

        .peca-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }

        .peca-item:last-child {
            border-bottom: none;
        }

        .qtd {
            font-weight: bold;
            color: var(--primary);
            margin-right: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Extração Inteligente de Peças</h2>

        <!-- Zona de Drop/Upload -->
        <div class="upload-area" id="drop-zone">
            <p>📁 <strong>Clique para escolher</strong> ou arraste o PDF do manual do AIR aqui.</p>
            <input type="file" id="file-input" accept="application/pdf">
        </div>

        <!-- Mensagem de carregando -->
        <div id="loader">
            ⏳ Lendo o PDF e enviando para a IA. Aguarde...
        </div>

        <!-- Área onde a lista será gerada -->
        <div id="results"></div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const loader = document.getElementById('loader');
        const results = document.getElementById('results');

        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', handleFileSelect);

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file && file.type === 'application/pdf') {
                processarPDF(file);
            } else {
                alert('Por favor, selecione um arquivo PDF válido do AIR.');
            }
        }

        // Lê o PDF no navegador e envia apenas o texto para a API do Vercel
        async function processarPDF(file) {
            dropZone.style.display = 'none';
            loader.style.display = 'block';
            results.style.display = 'none';

            try {
                // 1. Extrai o texto do PDF localmente
                const arrayBuffer = await file.arrayBuffer();
                const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
                const pdfDoc = await loadingTask.promise;
                let textoCompleto = "";

                for (let i = 1; i <= pdfDoc.numPages; i++) {
                    const page = await pdfDoc.getPage(i);
                    const textContent = await page.getTextContent();
                    const textItems = textContent.items.map(item => item.str);
                    textoCompleto += textItems.join(" ") + "\n";
                }

                // 2. Envia o texto extraído para a API do Vercel via JSON
                const resposta = await fetch('/api/extrair-pecas', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ textoManual: textoCompleto })
                });

                if (!resposta.ok) {
                    throw new Error(`Erro na comunicação com o servidor: ${resposta.status}`);
                }

                const dadosJSON = await resposta.json();
                renderizarResultados(dadosJSON);

            } catch (erro) {
                console.error("Falha ao processar:", erro);
                alert("Ocorreu um erro ao analisar o manual. Tente novamente.");
                dropZone.style.display = 'block';
                loader.style.display = 'none';
            }
        }

        function renderizarResultados(dados) {
            loader.style.display = 'none';
            results.style.display = 'block';
            results.innerHTML = '<h3>🔧 Checklist para o Catálogo (ETK)</h3>';

            dados.forEach(grupoData => {
                const tituloGrupo = document.createElement('div');
                tituloGrupo.className = 'grupo-titulo';
                tituloGrupo.textContent = grupoData.grupo;
                results.appendChild(tituloGrupo);

                grupoData.pecas.forEach(peca => {
                    const item = document.createElement('div');
                    item.className = 'peca-item';
                    item.innerHTML = `<div><span class="qtd">${peca.qtd}</span> ${peca.nome}</div>`;
                    results.appendChild(item);
                });
            });

            const btnVoltar = document.createElement('button');
            btnVoltar.textContent = "Processar novo manual";
            btnVoltar.style.cssText = "margin-top: 20px; padding: 10px; width: 100%; cursor: pointer; background: #0066b2; color: white; border: none; border-radius: 5px; font-weight: bold;";
            btnVoltar.onclick = () => location.reload();
            results.appendChild(btnVoltar);
        }
    </script>
</body>
</html>
