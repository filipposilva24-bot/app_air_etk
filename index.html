<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitor de Manuais AIR - Oficina AI</title>
    <style>
        :root {
            --primary: #0066b2; /* Azul estilo BMW */
            --bg: #f4f7f6;
            --text: #333;
            --card-bg: #fff;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        h2 {
            text-align: center;
            color: var(--primary);
        }

        /* Área de Upload */
        .upload-area {
            border: 2px dashed #ccc;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            background-color: var(--card-bg);
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .upload-area:hover, .upload-area.dragover {
            border-color: var(--primary);
            background-color: #e9f2fa;
        }

        .upload-area input[type="file"] {
            display: none;
        }

        /* Loader */
        #loader {
            display: none;
            text-align: center;
            margin: 20px 0;
            font-weight: bold;
            color: var(--primary);
        }

        /* Resultados */
        #results {
            display: none;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .grupo-titulo {
            background-color: #333;
            color: white;
            padding: 10px;
            border-radius: 5px;
            margin-top: 20px;
            font-size: 1.1em;
        }

        .peca-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }

        .peca-item:last-child {
            border-bottom: none;
        }

        .qtd {
            font-weight: bold;
            color: var(--primary);
            margin-right: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Extração Inteligente de Peças</h2>

        <!-- Zona de Drop/Upload -->
        <div class="upload-area" id="drop-zone">
            <p>📁 <strong>Clique para escolher</strong> ou arraste o PDF do manual do AIR aqui.</p>
            <input type="file" id="file-input" accept="application/pdf">
        </div>

        <!-- Mensagem de carregando -->
        <div id="loader">
            ⏳ A IA está lendo o manual e separando as peças. Aguarde...
        </div>

        <!-- Área onde a lista será gerada -->
        <div id="results"></div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const loader = document.getElementById('loader');
        const results = document.getElementById('results');

        // Clicar na área aciona o input
        dropZone.addEventListener('click', () => fileInput.click());

        // Evento quando o arquivo é selecionado
        fileInput.addEventListener('change', handleFileSelect);

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file && file.type === 'application/pdf') {
                processarPDF(file);
            } else {
                alert('Por favor, selecione um arquivo PDF válido do AIR.');
            }
        }

        // Função que simula o envio para o backend
        function processarPDF(file) {
            // Esconde a área de upload e mostra o loader
            dropZone.style.display = 'none';
            loader.style.display = 'block';
            results.style.display = 'none';

            // SIMULAÇÃO: Aqui vai entrar o código do Passo 2 (fetch para sua API)
            // Vamos simular que a API demorou 3 segundos e devolveu este JSON estruturado:
            setTimeout(() => {
                const mockRespostaDaIA = [
                    {
                        "grupo": "Grupo 33 - Eixo Traseiro",
                        "pecas": [
                            { "qtd": "1", "nome": "Diferencial da roda traseira" },
                            { "qtd": "1", "nome": "Kit de reparação da porca de embutir" },
                            { "qtd": "2", "nome": "Anel de retenção do veio de saída" },
                            { "qtd": "1,0 l", "nome": "Óleo aprovado para diferencial traseiro" }
                        ]
                    },
                    {
                        "grupo": "Grupo 18 - Sistema de Escape",
                        "pecas": [
                            { "qtd": "1", "nome": "Abraçadeira de fita ou V-Band" },
                            { "qtd": "Div.", "nome": "Porcas de fixação do sistema de escape" }
                        ]
                    }
                ];

                renderizarResultados(mockRespostaDaIA);
            }, 3000); // Finge um atraso de 3s do processamento da IA
        }

        // Função para construir o HTML a partir do JSON recebido
        function renderizarResultados(dados) {
            loader.style.display = 'none';
            results.style.display = 'block';
            
            results.innerHTML = '<h3>🔧 Checklist para o Catálogo (ETK)</h3>';

            dados.forEach(grupoData => {
                // Cria o título do Grupo
                const tituloGrupo = document.createElement('div');
                tituloGrupo.className = 'grupo-titulo';
                tituloGrupo.textContent = grupoData.grupo;
                results.appendChild(tituloGrupo);

                // Cria os itens das peças
                grupoData.pecas.forEach(peca => {
                    const item = document.createElement('div');
                    item.className = 'peca-item';
                    
                    item.innerHTML = `
                        <div><span class="qtd">${peca.qtd}</span> ${peca.nome}</div>
                    `;
                    results.appendChild(item);
                });
            });

            // Botão para processar outro manual
            const btnVoltar = document.createElement('button');
            btnVoltar.textContent = "Processar novo manual";
            btnVoltar.style.cssText = "margin-top: 20px; padding: 10px; width: 100%; cursor: pointer; background: #0066b2; color: white; border: none; border-radius: 5px;";
            btnVoltar.onclick = () => location.reload();
            results.appendChild(btnVoltar);
        }
    </script>
</body>
</html>
